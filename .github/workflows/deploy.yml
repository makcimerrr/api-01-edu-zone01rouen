name: Build & Publish

# Construit l'image Deno et la publie sur GHCR à chaque push sur main.
# Le VPS la récupère ensuite tout seul (cron `docker compose pull && up -d` dans
# ~/sites/zone01-api) → auto-deploy pull-based, SANS clé SSH ni build sur le VPS.
# (Remplace l'ancien deploy vers Deno Deploy Classic, sunset le 2026-07-20.)
#
# Prérequis : le package GHCR `api-01-edu-zone01rouen` doit être PUBLIC (pull
# anonyme depuis le VPS) — GitHub > Packages > settings > visibility > Public.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/makcimerrr/api-01-edu-zone01rouen

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
